name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-macos:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run tests with coverage export
        id: coverage
        run: |
          OUT_DIR="$(./tools/ci_coverage_export.sh)"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build launchable app and artifacts
        id: package
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          OUT_DIR="$(./tools/package_macos_artifacts.sh ci-${SHORT_SHA})"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Smoke test status endpoint
        run: ./tools/ci_smoke_status.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loadershell-coverage-${{ github.sha }}
          path: |
            ${{ steps.coverage.outputs.out_dir }}/coverage-summary.txt
            ${{ steps.coverage.outputs.out_dir }}/coverage.lcov
            ${{ steps.coverage.outputs.out_dir }}/default.profdata
          if-no-files-found: error

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loadershell-macos-ci-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.out_dir }}/LoaderShell-ci-*.app.zip
            ${{ steps.package.outputs.out_dir }}/LoaderShell-ci-*-macos
            ${{ steps.package.outputs.out_dir }}/SHA256SUMS.txt
          if-no-files-found: error
